<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - CodeGuild</title>
    <link rel="stylesheet" href="../../estilos/global.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-layout">
    <div class="auth-container">
        <div class="auth-card card">
            <div class="auth-header">
                <div class="auth-logo">CodeGuild</div>
                <h1>Conecte-se e comece a construir.</h1>
            </div>
            
            <form class="auth-form" action="../painel/index.html">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="seu.email@universidade.edu" required>
                </div>
                
                <div class="form-group">
                    <div class="label-row">
                        <label for="password">Senha</label>
                        <a href="#" class="forgot-password">Esqueceu a senha?</a>
                    </div>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                
                <button type="submit" class="btn btn-primary btn-block">Entrar na minha conta</button>
            </form>
            
            <div class="auth-footer">
                Novo no CodeGuild? <a href="#">Criar uma conta</a>
            </div>
        </div>
    </div>
</body>
</html>
