<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar conta - CodeGuild</title>
    <link rel="icon" href="../../marca/web/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="../../marca/web/apple-touch-icon.png">
    <link rel="stylesheet" href="../../estilos/global.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-layout">
    <div class="auth-container">
        <div class="auth-card card">
            <div class="auth-header">
                <div class="auth-logo"><a href="../inicio/index.html"><img src="../../marca/web/logo-vertical.webp" alt="CodeGuild" width="121" height="120"></a></div>
                <h1>Crie sua conta e encontre seu squad.</h1>
            </div>

            <p id="register-closed" class="form-success" role="status" hidden>
                O cadastro abre em <span id="register-launch-date"></span>.
                <a href="../inicio/index.html#pre-cadastro">Faça seu pré-cadastro</a> para ser avisado no lançamento.
            </p>

            <form class="auth-form" novalidate>
                <p id="register-error" class="form-error" role="alert" hidden></p>
                <p id="register-success" class="form-success" role="status" hidden></p>

                <div class="form-group">
                    <label for="username">Usuário</label>
                    <input type="text" id="username" name="username" placeholder="seu.usuario" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="30" aria-describedby="username-hint username-error" required>
                    <p id="username-hint" class="field-hint">3 a 30 caracteres: letras, números, ponto, hífen ou sublinhado.</p>
                    <p id="username-error" class="field-error" role="alert" hidden></p>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="seu.email@universidade.edu" autocomplete="email" maxlength="254" aria-describedby="email-error" required>
                    <p id="email-error" class="field-error" role="alert" hidden></p>
                </div>

                <div class="form-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" name="password" autocomplete="new-password" placeholder="••••••••" aria-describedby="password-hint password-error" required>
                    <p id="password-hint" class="field-hint">Mínimo de 8 caracteres.</p>
                    <p id="password-error" class="field-error" role="alert" hidden></p>
                </div>

                <div class="form-group">
                    <label for="password_confirm">Confirmar senha</label>
                    <input type="password" id="password_confirm" name="password_confirm" autocomplete="new-password" placeholder="••••••••" aria-describedby="password_confirm-error" required>
                    <p id="password_confirm-error" class="field-error" role="alert" hidden></p>
                </div>

                <button type="submit" class="btn btn-primary btn-block">Criar conta</button>
            </form>

            <div class="auth-footer">
                Já possui conta? <a href="../login/index.html">Entrar</a>
            </div>

            <div class="auth-back">
                <a href="../inicio/index.html">&larr; Voltar para a página inicial</a>
            </div>
        </div>
    </div>

    <script src="../../scripts/auth.js"></script>
    <script src="../../scripts/api.js"></script>
    <script src="../../scripts/launch.js"></script>
    <script src="../../scripts/cadastro.js"></script>
</body>
</html>
