<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar conta - CodeGuild</title>
    <link rel="stylesheet" href="../../estilos/global.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-layout">
    <div class="auth-container">
        <div class="auth-card card">
            <div class="auth-header">
                <div class="auth-logo"><a href="../inicio/index.html">CodeGuild</a></div>
                <h1>Crie sua conta e encontre seu squad.</h1>
            </div>

            <form class="auth-form" novalidate>
                <p id="register-error" class="form-error" role="alert" hidden></p>
                <p id="register-success" class="form-success" role="status" hidden></p>

                <div class="form-group">
                    <label for="username">Usuário</label>
                    <input type="text" id="username" name="username" placeholder="seu.usuario" autocomplete="username" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="seu.email@universidade.edu" autocomplete="email" required>
                </div>

                <div class="form-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" name="password" autocomplete="new-password" placeholder="••••••••" required>
                </div>

                <div class="form-group">
                    <label for="password_confirm">Confirmar senha</label>
                    <input type="password" id="password_confirm" name="password_confirm" autocomplete="new-password" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn btn-primary btn-block">Criar conta</button>
            </form>

            <div class="auth-footer">
                Já possui conta? <a href="../login/index.html">Entrar</a>
            </div>
        </div>
    </div>

    <script src="../../scripts/auth.js"></script>
    <script src="../../scripts/api.js"></script>
    <script src="../../scripts/cadastro.js"></script>
</body>
</html>
